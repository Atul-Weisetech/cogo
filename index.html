<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1420" />
    <meta
      name="description"
      content="Cogo — Move smarter, ride together. Verified carpooling with upfront fares, live tracking and Women Mode."
    />
    <link rel="icon" type="image/png" href="/cogo-favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/cogo-favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Cogo — Move Smarter. Ride Together.</title>
    <!-- apply the saved theme before first paint so dark mode doesn't flash light -->
    <script>
      try {
        if (localStorage.getItem("cogo-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
